component:
  name: "::Hello Component"
  repository: "gitHost/hello.git"
  default-branch: main
  submodule-strategy: none
  build:
    - # TODO add artifact<
    - type: ScriptRunner
      configuration-name: "Create name"
      scripts:
        - step-name: "Create name artifact"
          file: "create.sh" # path is defined as ./scripts/<file>
    - type: ScriptRunner
      configuration-name: "Greeting"
      scripts:
        - step-name: "say hello"
          file: "hello.sh" # path is defined as ./scripts/<file>
      dependencies:
        - build-configuration-name: "Composite"
          failure-action: FAIL
          artifacts:
            - source: "artifact.txt"
      triggers:
        - type: "vcs"
          include-branches:
            - main